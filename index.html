<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DualPay - PWA Ресто</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #3d1f16; /* Шоколадово кафяво */
            overflow: hidden; margin: 0; height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(15px); 
            border-radius: 2.5rem; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        @keyframes float {
            0% { transform: translate(0,0) rotate(0deg) scale(1); }
            50% { transform: translate(20px, -25px) rotate(10deg) scale(1.1); }
            100% { transform: translate(0,0) rotate(0deg) scale(1); }
        }
        .symbol { 
            position: absolute; color: #ffe135; opacity: 0.8; 
            animation: float 6s infinite ease-in-out; font-weight: bold;
        }
        .bg-grid {
            display: grid; grid-template-columns: repeat(8, 1fr);
            position: fixed; inset: 0; z-index: -1;
        }
        .segmented-control {
            display: flex; background: rgba(0,0,0,0.3); padding: 2px; border-radius: 12px;
        }
        .seg-btn { flex: 1; padding: 6px; border-radius: 10px; font-size: 10px; font-weight: bold; transition: 0.3s; }
        .seg-active { background: #ffe135; color: #3d1f16; }
    </style>
</head>
<body>

    <div id="grid-bg" class="bg-grid"></div>

    <div class="glass-card p-8 w-full max-w-sm">
        <header class="text-center mb-6">
            <canvas id="app-icon" width="80" height="80" class="mx-auto mb-3 rounded-2xl shadow-lg"></canvas>
            <h1 class="text-3xl font-bold" style="font-family: 'Comfortaa'; color: #ffe135;">DualPay</h1>
        </header>

        <div class="space-y-4">
            <div class="p-4 rounded-2xl shadow-inner" style="background-color: #ff8c00;"> 
                <label class="block text-[10px] font-bold text-white uppercase mb-1">Сума за плащане</label>
                <div class="flex gap-2 border-b border-white/50">
                    <input type="number" id="price" oninput="calculate()" placeholder="0.00" class="w-full bg-transparent text-white font-bold outline-none placeholder:text-white/50">
                    <select id="pCurr" onchange="calculate()" class="bg-transparent text-white font-bold outline-none">
                        <option value="BGN" class="text-black">лв</option>
                        <option value="EUR" class="text-black">€</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-2">
                <div class="flex-1 p-3 bg-white/10 rounded-xl">
                    <label class="block text-[9px] text-white/70 font-bold mb-1 uppercase">Платено в лв</label>
                    <input type="number" id="cashBGN" oninput="calculate()" placeholder="0.00" class="w-full bg-transparent text-[#ffe135] font-bold outline-none">
                </div>
                <div class="flex-1 p-3 bg-white/10 rounded-xl">
                    <label class="block text-[9px] text-white/70 font-bold mb-1 uppercase">Платено в €</label>
                    <input type="number" id="cashEUR" oninput="calculate()" placeholder="0.00" class="w-full bg-transparent text-[#ffe135] font-bold outline-none">
                </div>
            </div>

            <div id="error" class="hidden p-3 bg-red-600/80 text-white text-[10px] font-bold rounded-xl text-center animate-pulse">
                НЕДОСТАТЪЧНА СУМА!
            </div>

            <div id="resBox" class="hidden p-4 rounded-2xl border border-white/20 bg-white/5">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[10px] text-white font-bold uppercase tracking-widest">Ресто</span>
                    <div class="segmented-control">
                        <button onclick="setMode('BGN')" id="btnBGN" class="seg-btn seg-active">BGN</button>
                        <button onclick="setMode('EUR')" id="btnEUR" class="seg-btn text-white">EUR</button>
                    </div>
                </div>
                <div id="mainRes" class="text-2xl font-bold" style="color: #ffe135;"></div>
                <div id="subRes" class="text-[10px] text-white/40 italic mt-1"></div>
            </div>
        </div>

        <footer class="mt-8 text-center text-[9px] text-white/30 uppercase tracking-tighter">
            <p>Курс: 1 EUR = 1.95583 BGN</p>
            <p class="mt-1 font-bold text-white/50">© КИРИЛ</p>
        </footer>
    </div>

    <script>
        const RATE = 1.95583;
        let mode = 'BGN';

        // 1. Икона през Canvas
        const cvs = document.getElementById('app-icon');
        const ctx = cvs.getContext('2d');
        ctx.fillStyle = '#FFD700'; // Златно
        ctx.roundRect ? ctx.roundRect(0,0,80,80,18) : ctx.rect(0,0,80,80);
        ctx.fill();
        ctx.fillStyle = '#3d1f16'; ctx.font = 'bold 18px Comfortaa'; ctx.textAlign = 'center';
        ctx.fillText('€ ⇄ лв', 40, 48);

        // 2. Шахматна мрежа
        const grid = document.getElementById('grid-bg');
        for(let i=0; i<40; i++) {
            const s = document.createElement('div');
            s.className = 'symbol';
            s.innerText = i % 2 === 0 ? '€' : 'лв';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.animationDelay = (Math.random() * 5) + 's';
            grid.appendChild(s);
        }

        // 3. Логика
        function calculate() {
            let price = parseFloat(document.getElementById('price').value) || 0;
            if(document.getElementById('pCurr').value === 'EUR') price *= RATE;
            
            let paid = (parseFloat(document.getElementById('cashBGN').value) || 0) + 
                       ((parseFloat(document.getElementById('cashEUR').value) || 0) * RATE);
            
            let diff = paid - price;
            const resBox = document.getElementById('resBox');
            const err = document.getElementById('error');

            if(price > 0 && paid < price) {
                err.classList.remove('hidden'); resBox.classList.add('hidden');
            } else if(price > 0) {
                err.classList.add('hidden'); resBox.classList.remove('hidden');
                updateRes(diff);
            } else {
                resBox.classList.add('hidden'); err.classList.add('hidden');
            }
        }

        function updateRes(val) {
            const m = document.getElementById('mainRes');
            const s = document.getElementById('subRes');
            if(mode === 'BGN') {
                m.innerText = val.toFixed(2) + " лв";
                s.innerText = "Еквивалент: " + (val/RATE).toFixed(2) + " €";
            } else {
                m.innerText = (val/RATE).toFixed(2) + " €";
                s.innerText = "Еквивалент: " + val.toFixed(2) + " лв";
            }
        }

        function setMode(m) {
            mode = m;
            document.getElementById('btnBGN').classList.toggle('seg-active', m === 'BGN');
            document.getElementById('btnEUR').classList.toggle('seg-active', m === 'EUR');
            calculate();
        }

        // 4. PWA - МАНИФЕСТ И SERVICE WORKER (За Install бутона)
        try {
            const manifest = {
                name: "DualPay Calculator", short_name: "DualPay", 
                start_url: ".", display: "standalone",
                background_color: "#3d1f16", theme_color: "#ff8c00",
                icons: [{ src: cvs.toDataURL(), sizes: "192x192", type: "image/png" }]
            };
            const mBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const mLink = document.createElement('link');
            mLink.rel = 'manifest'; mLink.href = URL.createObjectURL(mBlob);
            document.head.appendChild(mLink);

            if ('serviceWorker' in navigator) {
                const sw = "self.addEventListener('fetch', (e) => {});";
                const swBlob = new Blob([sw], {type: 'text/javascript'});
                navigator.serviceWorker.register(URL.createObjectURL(swBlob));
            }
        } catch(e) {}
    </script>
</body>
</html>
