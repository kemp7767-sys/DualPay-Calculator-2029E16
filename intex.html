<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>DualPay — Калкулатор за ресто</title>

  <!-- Tailwind CDN (play) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --oil-green: #6B8E6B; /* масленозелен фон */
      --glass-bg: rgba(230, 238, 228, 0.18); /* полупрозрачен glass */
      --accent: #0f6b4a; /* горско зелено (акцент) */
      --logo-tile: #a8d7ff; /* светло синьо плочка за лого */
      --pay-bg: #3b82f6; /* син фон за поле "Сума за плащане" */
      --card-radius: 18px;
      --rate: 1.95583;
    }

    html,body,#app {
      height:100%;
    }

    body{
      margin:0;
      font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, rgba(250,250,250,0.02), rgba(0,0,0,0.02));
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      background-color: var(--oil-green);
      overflow: hidden;
    }

    /* App window */
    .app-window{
      width: min(980px, 94vw);
      max-width: 720px;
      margin: 4vh auto;
      border-radius: var(--card-radius);
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      box-shadow: 0 20px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.03);
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 18px;
      position: relative;
      display:flex;
      flex-direction:column;
      gap: 14px;
    }

    /* background grid container takes full page under the card */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .symbol {
      position:absolute;
      font-size: clamp(18px, 4.2vw, 36px);
      color: rgba(255,255,255,0.18);
      font-weight:700;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
      text-shadow: 0 1px 0 rgba(255,255,255,0.02);
      transform-origin: center;
      will-change: transform, opacity;
    }

    /* Float animation: translate X/Y, rotate, scale */
    @keyframes floatXY {
      0% { transform: translate3d(0,0,0) rotate(0deg) scale(1); opacity:0.9; }
      33% { transform: translate3d(6px,-8px,0) rotate(-4deg) scale(1.06); }
      66% { transform: translate3d(-6px,8px,0) rotate(3deg) scale(0.98); }
      100% { transform: translate3d(0,0,0) rotate(0deg) scale(1); opacity:0.9; }
    }

    /* reveal animation for results */
    .reveal {
      transition: transform .36s cubic-bezier(.2,.9,.3,1), opacity .28s ease;
      transform-origin: top center;
    }

    .segmented button {
      font-family: "Montserrat";
    }

    /* small helpers */
    .logo-tile {
      width:56px;
      height:56px;
      border-radius:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      background: var(--logo-tile);
      box-shadow: 0 6px 18px rgba(10,20,40,0.2);
      font-family: "Comfortaa";
      font-weight:700;
      color: #064;
    }

    /* mobile optimizations (one-hand use): larger touch targets on right side minimized */
    @media (max-width:520px){
      .app-window{
        margin: 6vh 6px;
        padding:14px;
        gap:10px;
      }
      .logo-tile{ width:48px;height:48px;border-radius:10px;}
    }
  </style>
</head>
<body>
  <div id="app" class="relative min-h-screen flex items-center justify-center">

    <!-- dynamic background symbols -->
    <div id="bgGrid" class="bg-grid" aria-hidden="true"></div>

    <!-- App-like window -->
    <main class="app-window z-10" role="application" aria-label="DualPay калкулатор">
      <header class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="logo-tile" aria-hidden="true">
            <span style="font-size:18px">€⇄лв</span>
          </div>
          <div>
            <h1 class="text-white" style="font-family: 'Comfortaa'; font-size:1.05rem; margin:0">DualPay</h1>
            <p class="text-slate-200 text-sm" style="font-family: 'Montserrat'; margin:0">Калкулатор за ресто</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button id="installBtn" class="px-3 py-2 rounded-md text-white bg-[var(--accent)] shadow-md hidden">
            Инсталирай
          </button>
          <canvas id="appIconCanvas" width="64" height="64" class="rounded-md" aria-hidden="true" style="display:none"></canvas>
        </div>
      </header>

      <!-- Inputs -->
      <section class="grid grid-cols-1 gap-3">
        <label class="block">
          <span class="text-slate-200 text-sm">Сума за плащане</span>
          <div class="mt-1 flex gap-2">
            <input id="amountDue" type="number" inputmode="decimal" min="0" step="0.01" value="0.00"
              class="flex-1 rounded-md px-3 py-3 font-semibold text-white placeholder:text-slate-200 outline-none"
              style="background: var(--pay-bg); border: none; box-shadow: inset 0 2px 6px rgba(0,0,0,0.15)"
              aria-label="Сума за плащане">
            <select id="dueCurrency" aria-label="Валута за сумата" class="rounded-md px-3 py-3 bg-white/6 text-white">
              <option value="BGN">BGN (лв)</option>
              <option value="EUR">EUR (€)</option>
            </select>
          </div>
        </label>

        <div class="grid grid-cols-2 gap-2">
          <label class="block">
            <span class="text-slate-200 text-sm">Платено в лв</span>
            <input id="paidBgn" type="number" inputmode="decimal" min="0" step="0.01" value="0.00"
              class="mt-1 rounded-md px-3 py-3 bg-white/6 text-white outline-none" aria-label="Платено в лв">
          </label>
          <label class="block">
            <span class="text-slate-200 text-sm">Платено в €</span>
            <input id="paidEur" type="number" inputmode="decimal" min="0" step="0.01" value="0.00"
              class="mt-1 rounded-md px-3 py-3 bg-white/6 text-white outline-none" aria-label="Платено в Евро">
          </label>
        </div>
      </section>

      <!-- Error box -->
      <div id="errorBox" class="hidden rounded-md px-3 py-2 bg-red-600 text-white text-sm">
        Недостатъчна сума — добавете повече пари или коригирайте плащанията.
      </div>

      <!-- Results -->
      <section id="results" class="mt-1 reveal">
        <div class="flex items-center justify-between gap-3">
          <div>
            <div class="text-slate-200 text-sm">Ресто</div>
            <div id="changeMain" class="text-white text-2xl font-semibold mt-1" style="font-family: 'Comfortaa';">0.00 лв</div>
            <div id="changeSecondary" class="text-slate-300 text-sm mt-1">Еквивалент: 0.00 €</div>
          </div>

          <div class="segmented bg-white/6 p-1 rounded-md" role="tablist" aria-label="Валута за показване на рестото">
            <button id="showBgn" class="px-3 py-2 rounded-md text-white bg-transparent" aria-pressed="true">BGN</button>
            <button id="showEur" class="px-3 py-2 rounded-md text-white/70 bg-transparent" aria-pressed="false">EUR</button>
          </div>
        </div>
      </section>

      <footer class="mt-3 flex items-center justify-between text-slate-200 text-sm">
        <div>Курс: 1 EUR = 1.95583 BGN</div>
        <div>© КИРИЛ</div>
      </footer>
    </main>
  </div>

  <script>
    // ====== Конфигурация и селектори ======
    const RATE = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rate')) || 1.95583;
    const amountDueEl = document.getElementById('amountDue');
    const dueCurrencyEl = document.getElementById('dueCurrency');
    const paidBgnEl = document.getElementById('paidBgn');
    const paidEurEl = document.getElementById('paidEur');
    const errorBox = document.getElementById('errorBox');
    const changeMain = document.getElementById('changeMain');
    const changeSecondary = document.getElementById('changeSecondary');
    const showBgn = document.getElementById('showBgn');
    const showEur = document.getElementById('showEur');
    const resultsSection = document.getElementById('results');

    // Helper: format numbers
    function fmt(n, dec=2){
      return Number(n).toLocaleString('bg-BG', {minimumFractionDigits:dec, maximumFractionDigits:dec});
    }

    // Convert helpers
    function eurToBgn(e) { return e * RATE; }
    function bgnToEur(b) { return b / RATE; }

    // Compute total paid in BGN
    function totalPaidBgn(){
      const b = parseFloat(paidBgnEl.value) || 0;
      const e = parseFloat(paidEurEl.value) || 0;
      return b + eurToBgn(e);
    }

    // Get due in BGN (convert if due is EUR)
    function dueInBgn(){
      const d = parseFloat(amountDueEl.value) || 0;
      const cur = dueCurrencyEl.value;
      return (cur === 'EUR') ? eurToBgn(d) : d;
    }

    // Update UI based on inputs
    function update(){
      const dueBgn = dueInBgn();
      const paidBgn = totalPaidBgn();
      const diff = paidBgn - dueBgn;

      if (diff < -0.005){
        // insufficient
        errorBox.classList.remove('hidden');
        resultsSection.style.opacity = '0.6';
        resultsSection.style.transform = 'translateY(6px) scale(.995)';
      } else {
        errorBox.classList.add('hidden');
        // show change in currently selected display currency
        const showingEUR = showEur.getAttribute('aria-pressed') === 'true';
        if (showingEUR){
          const changeEur = Math.max(0, bgnToEur(diff));
          changeMain.textContent = fmt(changeEur) + ' €';
          changeSecondary.textContent = 'Еквивалент: ' + fmt(Math.max(0, diff)) + ' лв';
        } else {
          const changeBgn = Math.max(0, diff);
          changeMain.textContent = fmt(changeBgn) + ' лв';
          changeSecondary.textContent = 'Еквивалент: ' + fmt(Math.max(0, bgnToEur(diff))) + ' €';
        }

        // reveal smoothly
        resultsSection.style.opacity = '1';
        resultsSection.style.transform = 'translateY(0) scale(1)';
      }
    }

    // Wire inputs
    [amountDueEl, dueCurrencyEl, paidBgnEl, paidEurEl].forEach(el=>{
      el.addEventListener('input', update);
      el.addEventListener('change', update);
    });

    // segmented control
    showBgn.addEventListener('click', ()=> {
      showBgn.setAttribute('aria-pressed','true');
      showEur.setAttribute('aria-pressed','false');
      showBgn.classList.remove('text-white/70');
      showEur.classList.remove('text-white');
      showBgn.classList.add('text-white','bg-white/8');
      showEur.classList.add('text-white/70','bg-transparent');
      update();
    });
    showEur.addEventListener('click', ()=> {
      showBgn.setAttribute('aria-pressed','false');
      showEur.setAttribute('aria-pressed','true');
      showEur.classList.remove('text-white/70');
      showBgn.classList.remove('text-white');
      showEur.classList.add('text-white','bg-white/8');
      showBgn.classList.add('text-white/70','bg-transparent');
      update();
    });

    // Initialize appearance
    resultsSection.style.transition = 'transform .36s cubic-bezier(.2,.9,.3,1), opacity .28s ease';
    resultsSection.style.transform = 'translateY(6px) scale(.995)';
    resultsSection.style.opacity = '0.9';
    update();

    // ====== Dynamic background chessboard of symbols (лв → €) ======
    const symbols = ['лв','→','€'];
    const bgGrid = document.getElementById('bgGrid');

    function populateBackground(){
      const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
      const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
      bgGrid.innerHTML = '';
      const cols = Math.ceil(vw / 140);
      const rows = Math.ceil(vh / 120);
      let idx = 0;
      for (let r=0;r<rows;r++){
        for (let c=0;c<cols;c++){
          const el = document.createElement('div');
          el.className = 'symbol';
          const s = symbols[idx % symbols.length];
          el.textContent = s;
          idx++;

          // alternate visibility and positioning to create checkerboard feel
          const left = c * 140 + (r%2 ? 70 : 0) + (Math.random()*30-15);
          const top = r * 120 + (Math.random()*40-20);
          el.style.left = left + 'px';
          el.style.top = top + 'px';

          // color / visibility
          el.style.color = `rgba(255,255,255,${0.06 + (Math.random()*0.18)})`;
          // animation timing differences
          const dur = 6 + Math.random()*8;
          const delay = Math.random()*-6;
          el.style.animation = `floatXY ${dur}s ease-in-out ${delay}s infinite`;
          el.style.transform = `translateZ(0)`;
          bgGrid.appendChild(el);
        }
      }
    }

    window.addEventListener('resize', () => {
      populateBackground();
    });
    populateBackground();

    // ====== Canvas icon + dynamic SVG manifest + link rel manifest via Blob ======
    const canvas = document.getElementById('appIconCanvas');
    const ctx = canvas.getContext('2d');

    // draw rounded tile with accent color and "€ ⇄ лв" text using Comfortaa
    function drawIcon(){
      const w = canvas.width;
      const h = canvas.height;
      const radius = 12;
      ctx.clearRect(0,0,w,h);
      // background
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#0f6b4a';
      roundRect(ctx, 0, 0, w, h, radius);
      ctx.fill();

      // text symbol
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px Comfortaa, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('€ ⇄ лв', w/2, h/2 - 1);
      // small title DualPay bottom
      ctx.font = '600 9px Montserrat, sans-serif';
      ctx.fillText('DualPay', w/2, h - 12);
      return canvas.toDataURL('image/png');
    }

    function roundRect(ctx, x, y, width, height, radius){
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
    }

    // create SVG icon as well (for sharper manifest icon)
    function buildSvgIconHex(){
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#0f6b4a';
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">
          <rect rx="64" width="100%" height="100%" fill="${accent}"/>
          <text x="50%" y="48%" dominant-baseline="middle" text-anchor="middle" font-family="Comfortaa, sans-serif" font-size="140" fill="#fff">€ ⇄ лв</text>
          <text x="50%" y="90%" dominant-baseline="middle" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="36" fill="#ffffff">DualPay</text>
        </svg>
      `.trim();
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    // attach favicon dynamically and create manifest
    function registerIconsAndManifest(){
      // draw canvas
      const png = drawIcon();
      // set favicon link
      let link = document.querySelector('link[rel="icon"]');
      if (!link){
        link = document.createElement('link');
        link.rel = 'icon';
        document.head.appendChild(link);
      }
      link.href = png;

      // build manifest object with svg and png
      const svgData = buildSvgIconHex();
      const manifest = {
        name: "DualPay — Калкулатор",
        short_name: "DualPay",
        start_url: ".",
        display: "standalone",
        background_color: "#ffffff",
        theme_color: "#0f6b4a",
        icons: [
          { src: svgData, sizes: "512x512", type: "image/svg+xml" },
          { src: png, sizes: "64x64", type: "image/png" }
        ]
      };

      // create blob and set link rel manifest
      const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
      const manifestURL = URL.createObjectURL(manifestBlob);

      let mlink = document.querySelector('link[rel="manifest"]');
      if (!mlink){
        mlink = document.createElement('link');
        mlink.rel = 'manifest';
        document.head.appendChild(mlink);
      }
      mlink.href = manifestURL;
    }

    // ====== Service Worker via Blob ======
    async function registerServiceWorkerViaBlob(){
      if (!('serviceWorker' in navigator)) return;
      // minimal SW script: cache index and respond with cache falling back to network
      const swCode = `
        const CACHE_NAME = 'dualpay-cache-v1';
        const urlsToCache = [location.pathname || '/', location.href];

        self.addEventListener('install', event => {
          self.skipWaiting();
          event.waitUntil(
            caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache))
          );
        });

        self.addEventListener('activate', event => {
          event.waitUntil(self.clients.claim());
        });

        self.addEventListener('fetch', event => {
          const req = event.request;
          // only handle GET
          if (req.method !== 'GET') return;
          event.respondWith(
            caches.match(req).then(cached => cached || fetch(req).then(resp => {
              // optional: cache fetched assets (stale-while-revalidate)
              return resp;
            })).catch(()=>caches.match('/'))
          );
        });
      `.trim();

      try {
        const blob = new Blob([swCode], {type:'text/javascript'});
        const swUrl = URL.createObjectURL(blob);
        await navigator.serviceWorker.register(swUrl);
        console.log('Service worker registered via blob:', swUrl);
      } catch (e){
        console.warn('Service worker registration failed:', e);
      }
    }

    // ====== Install prompt handling (PWA) ======
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.remove('hidden');
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.classList.add('hidden');
      }
      deferredPrompt = null;
    });

    // Run icon/manifest/sw setup after fonts load (optional)
    window.addEventListener('load', async () => {
      drawIcon();
      registerIconsAndManifest();
      await registerServiceWorkerViaBlob();
      // subtle hint to enable install button on supported UAs
      setTimeout(()=> {
        // animate results for first-time show
        resultsSection.style.transform = 'translateY(0) scale(1)';
        resultsSection.style.opacity = '1';
      }, 240);
    });

    // Accessibility: allow arrow keys to change segmented
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        const left = e.key === 'ArrowLeft';
        if (left) showBgn.click(); else showEur.click();
      }
    });

    // Initial neatness: small idle animation on header logo tile
    (function logoIdle(){
      const tile = document.querySelector('.logo-tile');
      if (!tile) return;
      tile.animate([
        { transform: 'translateY(0) rotate(0deg)' },
        { transform: 'translateY(-4px) rotate(-2deg)' },
        { transform: 'translateY(0) rotate(0deg)' }
      ], { duration: 3500, iterations: Infinity, easing: 'ease-in-out' });
    })();

  </script>
</body>
</html>
