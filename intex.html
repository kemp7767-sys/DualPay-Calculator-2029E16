<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DualPay - Кирил</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #3d1f16; /* Шоколадово кафяво */
            overflow: hidden; 
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(15px); /* Фин стъклен ефект */
            border-radius: 2.5rem; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); /* Дълбоки сенки */
        }
        @keyframes float {
            0% { transform: translate(0,0) rotate(0deg) scale(1); }
            33% { transform: translate(30px, -30px) rotate(10deg) scale(1.2); }
            66% { transform: translate(-20px, 20px) rotate(-10deg) scale(0.8); }
            100% { transform: translate(0,0) rotate(0deg) scale(1); }
        }
        .symbol { 
            position: absolute; 
            color: #ffe135; /* Бананово жълто */
            opacity: 0.8; /* Открояващи се */
            animation: float 8s infinite ease-in-out; 
            pointer-events: none;
            font-weight: bold;
            font-size: 1.5rem;
        }
        .bg-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 20px;
            position: fixed;
            inset: 0;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div id="grid-bg" class="bg-grid"></div>

    <div class="glass-card p-8 w-full max-w-sm text-center">
        <div id="logo-wrap" class="mb-6 flex justify-center">
            <canvas id="icon-cvs" width="100" height="100" class="rounded-2xl shadow-lg"></canvas>
        </div>

        <h1 class="text-3xl font-bold mb-6" style="font-family: 'Comfortaa'; color: #ffe135;">DualPay</h1>

        <div class="space-y-4 text-left">
            <div class="p-4 rounded-2xl" style="background-color: #ff8c00;"> <label class="block text-[10px] font-bold text-white uppercase mb-1">Сума за плащане</label>
                <div class="flex gap-2">
                    <input type="number" id="totalPrice" oninput="calculate()" placeholder="0.00" class="w-full bg-transparent border-b-2 border-white text-white font-bold outline-none">
                    <select id="priceCurrency" onchange="calculate()" class="bg-transparent text-white font-bold outline-none cursor-pointer">
                        <option value="BGN" class="text-black">лв</option>
                        <option value="EUR" class="text-black">€</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-2">
                <div class="flex-1 p-3 bg-white/20 rounded-xl">
                    <label class="block text-[9px] text-white/70 font-bold mb-1">ПЛАТЕНО В ЛВ</label>
                    <input type="number" id="paidBGN" oninput="calculate()" placeholder="0.00" class="w-full bg-transparent text-white font-bold outline-none">
                </div>
                <div class="flex-1 p-3 bg-white/20 rounded-xl">
                    <label class="block text-[9px] text-white/70 font-bold mb-1">ПЛАТЕНО В €</label>
                    <input type="number" id="paidEUR" oninput="calculate()" placeholder="0.00" class="w-full bg-transparent text-white font-bold outline-none">
                </div>
            </div>

            <div id="errorBox" class="hidden p-3 bg-red-600 text-white text-xs font-bold rounded-xl text-center">
                Недостатъчна сума!
            </div>

            <div id="resultBox" class="hidden transition-opacity duration-500 bg-white/10 p-4 rounded-2xl border border-white/20">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[10px] text-white/70 font-bold uppercase">Ресто:</span>
                    <div class="flex bg-black/30 rounded-lg p-1">
                        <button onclick="setResultCurr('BGN')" id="btnBGN" class="px-2 py-1 text-[10px] rounded bg-[#ffe135] text-black font-bold">BGN</button>
                        <button onclick="setResultCurr('EUR')" id="btnEUR" class="px-2 py-1 text-[10px] rounded text-white font-bold">EUR</button>
                    </div>
                </div>
                <div id="mainRes" class="text-2xl font-bold" style="color: #ffe135;"></div>
                <div id="subRes" class="text-xs text-white/50 italic"></div>
            </div>
        </div>

        <footer class="mt-8 text-[10px] text-white/40 tracking-widest uppercase">
            <p>Курс: 1 EUR = 1.95583 BGN</p>
            <p class="mt-1 font-bold">© КИРИЛ</p>
        </footer>
    </div>

    <script>
        const RATE = 1.95583;
        let resultCurrency = 'BGN';

        // 1. Икона и Лого през Canvas
        const cvs = document.getElementById('icon-cvs');
        const ctx = cvs.getContext('2d');
        ctx.fillStyle = '#FFD700'; // Златно
        ctx.beginPath(); ctx.roundRect(0, 0, 100, 100, 25); ctx.fill();
        ctx.fillStyle = '#3d1f16';
        ctx.font = 'bold 22px Comfortaa';
        ctx.textAlign = 'center';
        ctx.fillText('€ ⇄ лв', 50, 60);

        // 2. Генериране на шахматен фон
        const bg = document.getElementById('grid-bg');
        for(let i=0; i<30; i++) {
            const s = document.createElement('div');
            s.className = 'symbol';
            s.innerText = i % 2 === 0 ? '€' : 'лв';
            s.style.left = Math.random() * 90 + '%';
            s.style.top = Math.random() * 90 + '%';
            s.style.animationDelay = (Math.random() * 5) + 's';
            bg.appendChild(s);
        }

        // 3. Логика
        function calculate() {
            let price = parseFloat(document.getElementById('totalPrice').value) || 0;
            const pCurr = document.getElementById('priceCurrency').value;
            let paidBGN = parseFloat(document.getElementById('paidBGN').value) || 0;
            let paidEUR = parseFloat(document.getElementById('paidEUR').value) || 0;

            let totalInBGN = pCurr === 'EUR' ? price * RATE : price;
            let totalPaidInBGN = paidBGN + (paidEUR * RATE);
            let changeBGN = totalPaidInBGN - totalInBGN;

            const resBox = document.getElementById('resultBox');
            const errBox = document.getElementById('errorBox');

            if (totalPaidInBGN < totalInBGN && totalInBGN > 0) {
                errBox.classList.remove('hidden');
                resBox.classList.add('hidden');
            } else if (totalInBGN > 0) {
                errBox.classList.add('hidden');
                resBox.classList.remove('hidden');
                updateDisplay(changeBGN);
            } else {
                resBox.classList.add('hidden');
                errBox.classList.add('hidden');
            }
        }

        function updateDisplay(bgn) {
            const main = document.getElementById('mainRes');
            const sub = document.getElementById('subRes');
            if (resultCurrency === 'BGN') {
                main.innerText = bgn.toFixed(2) + " лв";
                sub.innerText = "Еквивалент: " + (bgn/RATE).toFixed(2) + " €";
            } else {
                main.innerText = (bgn/RATE).toFixed(2) + " €";
                sub.innerText = "Еквивалент: " + bgn.toFixed(2) + " лв";
            }
        }

        function setResultCurr(c) {
            resultCurrency = c;
            document.getElementById('btnBGN').className = c === 'BGN' ? 'px-2 py-1 text-[10px] rounded bg-[#ffe135] text-black font-bold' : 'px-2 py-1 text-[10px] rounded text-white font-bold';
            document.getElementById('btnEUR').className = c === 'EUR' ? 'px-2 py-1 text-[10px] rounded bg-[#ffe135] text-black font-bold' : 'px-2 py-1 text-[10px] rounded text-white font-bold';
            calculate();
        }

        // 4. PWA - Web Manifest & SW през Blob
        const manifest = {
            name: "DualPay", short_name: "DualPay", display: "standalone",
            background_color: "#3d1f16", theme_color: "#ff8c00",
            icons: [{ src: cvs.toDataURL(), sizes: "192x192", type: "image/png" }]
        };
        const mBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const mURL = URL.createObjectURL(mBlob);
        const link = document.createElement('link');
        link.rel = 'manifest'; link.href = mURL;
        document.head.appendChild(link);

        if ('serviceWorker' in navigator) {
            const sw = "self.addEventListener('fetch', (e) => {});";
            const swBlob = new Blob([sw], {type: 'text/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(swBlob));
        }
    </script>
</body>
</html>
